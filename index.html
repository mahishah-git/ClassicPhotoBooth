<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vintage Photo Booth</title>

    <link rel="stylesheet" href="photobooth.css">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

</head>

<body>

<div id="booth">

    <div id="header">

        <h1>Classic Photo Booth</h1>

        <p>
            Scroll Down to Download your Poloroid. (Scroll to the end to see the generated photo strip!)
        </p>

    </div>


    <!-- CAMERA -->

    <div id="cameraBox">

        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>

        <canvas id="captureCanvas"></canvas>

        <div id="flash"></div>

        <div id="countdown"></div>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

        <button id="captureBtn">
            📸 Take Photo
        </button>

        <span id="counter">
            0 / 9 Photos
        </span>

    </div>


    <!-- PREVIEW GRID -->

    <div id="previewGrid">

        <div class="preview"></div>
        <div class="preview"></div>
        <div class="preview"></div>

        <div class="preview"></div>
        <div class="preview"></div>
        <div class="preview"></div>

        <div class="preview"></div>
        <div class="preview"></div>
        <div class="preview"></div>

    </div>


    <!-- ACTION BUTTONS -->

    <div id="actions">

        <button id="createStripBtn" disabled>

            🎞 Create Photo Strip

        </button>

        <button id="downloadBtn" style="display:none;">

            ⬇ Download

        </button>


    </div>


    <!-- FINAL STRIP -->

    <div id="stripContainer">

        <canvas id="stripCanvas"></canvas>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script src="photobooth.js"></script>

</body>

</html>
